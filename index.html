<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Paletas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <img
          src="./recursos/Logo.svg"
          alt="Logo de la aplicación"
          class="logo"
        />
        <h1>Generador de Paletas</h1>
      </nav>
    </header>

    <main>
      <section class="controls">
        <label for="palette-size">Seleccionar tamaño:</label>
        <select id="palette-size" name="palette-size">
          <option value="6">6 colores</option>
          <option value="8">8 colores</option>
          <option value="9">9 colores</option>
        </select>

        <button id="generate-btn">Generar paleta</button>
      </section>

      <section id="palette-container" class="palette-grid"></section>
    </main>

    <div id="toast-container" class="toast hidden" aria-hidden="true"></div>

    <script src="app.js"></script>
  </body>
</html>
